<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172033">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/style.css">
  <title>PDF Book Reader</title>
</head>
<body>
<header class="topbar">
  <div class="brand">📚 PDF Book Reader</div>
  <div class="toolbar">
    <button id="chooseFolderBtn">Chọn thư mục PDF</button>
    <button id="refreshBtn" class="secondary">Làm mới</button>
    <button id="fullscreenBtn" class="secondary">Toàn màn hình</button>
  </div>
</header>
<main>
  <section id="libraryView" class="library">
    <div class="intro">
      <h1>Thư viện tài liệu</h1>
      <p>Chọn thư mục chứa PDF trên thiết bị. Ứng dụng sẽ thử ghi nhớ thư mục để dùng lại lần sau.</p>
      <p id="status" class="status" role="status">Chưa chọn thư mục.</p>
      <button id="permissionBtn" hidden>Cấp lại quyền đọc thư mục</button>
    </div>
    <div id="pdfList" class="pdf-grid">
      <div class="empty">Chưa có tài liệu. Hãy chọn thư mục PDF.</div>
    </div>
  </section>
  <section id="readerView" class="reader" hidden>
    <div class="reader-head">
      <button id="backBtn" class="secondary">← Thư viện</button>
      <div id="currentTitle" class="current-title">Tài liệu PDF</div>
      <div id="pageInfo" class="page-info">Trang 0 / 0</div>
    </div>
    <div class="book-stage">
      <div id="book" class="book"></div>
      <div id="loading" class="loading" hidden>Đang tải PDF…</div>
    </div>
    <div class="reader-controls">
      <button id="prevBtn" class="secondary">← Trang trước</button>
      <label>Trang <input id="pageInput" type="number" min="1" value="1"></label>
      <button id="goPageBtn" class="secondary">Đi đến</button>
      <button id="nextBtn">Trang sau →</button>
    </div>
  </section>
</main>
<footer>PDF được đọc trực tiếp trên thiết bị. Không tải tài liệu lên máy chủ.</footer>
<script src="./vendor/pdf.min.js"></script>
<script src="./vendor/page-flip.browser.js"></script>
<script src="./js/db.js"></script>
<script src="./js/app.js"></script>
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(console.error));
}
</script>
</body>
</html>
